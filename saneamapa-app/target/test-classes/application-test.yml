spring:
  datasource:
    url: jdbc:h2:mem:saneamapa_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

saneamapa:
  storage:
    upload-dir: ${java.io.tmpdir}/saneamapa-test-uploads
