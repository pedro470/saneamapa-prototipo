server:
  port: 8080

spring:
  application:
    name: saneamapa
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saneamapa}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 80MB

saneamapa:
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  jwt:
    secret: ${JWT_SECRET:SaneaMapaCesmac2026ChaveSecretaSuperSeguraComMaisDe64CaracteresParaHS256}
    expiration-minutes: 30
  fila:
    peso-relatos: 6.0
    peso-dias-espera: 1.5
    peso-urgencia: 15.0
    peso-densidade-bairro: 2.0
    bonus-identificado: 10.0
