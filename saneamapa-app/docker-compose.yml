services:
  postgres:
    image: postgres:16-alpine
    container_name: saneamapa-postgres
    environment:
      POSTGRES_DB: saneamapa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - saneamapa_pgdata:/var/lib/postgresql/data
      - ./database/01_ddl_4_integridades.sql:/docker-entrypoint-initdb.d/01_ddl_4_integridades.sql:ro
      - ./database/02_triggers.sql:/docker-entrypoint-initdb.d/02_triggers.sql:ro
      - ./database/03_indices.sql:/docker-entrypoint-initdb.d/03_indices.sql:ro
      - ./database/04_contas_permissoes.sql:/docker-entrypoint-initdb.d/04_contas_permissoes.sql:ro
      - ./database/05_views.sql:/docker-entrypoint-initdb.d/05_views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saneamapa"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: saneamapa-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/saneamapa
      DB_USER: postgres
      DB_PASS: ${DB_PASS:-postgres}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - saneamapa_uploads:/app/uploads

volumes:
  saneamapa_pgdata:
  saneamapa_uploads:
