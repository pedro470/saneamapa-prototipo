server:
  port: 8080

spring:
  application:
    name: saneamapa
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saneamapa}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 80MB

saneamapa:
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  jwt:
    # Sem JWT_SECRET, o app gera uma chave aleatória a cada inicialização (ver JwtService).
    secret: ${JWT_SECRET:}
    expiration-minutes: 30
  fila:
    # RF005, nota 1
    peso-relatos: 6.0
    limite-relatos: 10
    peso-dias-espera: 1.5
    peso-urgencia: 15.0
    peso-densidade-bairro: 2.0
    limite-densidade-bairro: 10
  lgpd:
    # RNF20: nome e telefone são eliminados N dias depois da primeira vistoria do ponto feita após o relato.
    prazo-guarda-dias: ${PRAZO_GUARDA_DIAS:180}
    # RNF19: o controlador é a prefeitura que opera o sistema. Preencha na instalação.
    controlador-nome: ${CONTROLADOR_NOME:Prefeitura (exemplo de demonstração)}
    controlador-contato: ${CONTROLADOR_CONTATO:ouvidoria@exemplo.gov.br}
    encarregado-nome: ${ENCARREGADO_NOME:Encarregado de dados (exemplo)}
    encarregado-contato: ${ENCARREGADO_CONTATO:encarregado.lgpd@exemplo.gov.br}
