<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SaneaMapa — Área do Fiscal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=Public+Sans:wght@400;600;700&family=Source+Code+Pro:wght@400&display=swap">
  <link rel="stylesheet" href="/ds/bundle.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { margin: 0; font-family: var(--font-body); }
  </style>
</head>
<body>
<div class="app-mobile-wrap">
  <div class="celular" id="app"></div>
</div>

<script src="/js/avisos.js"></script>
<script src="/js/mapa-saneamapa.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));

let mapaFiscalCtrl = null;

let st = {
  token: sessionStorage.getItem('sm_fiscal_token') || '',
  usuario: JSON.parse(sessionStorage.getItem('sm_fiscal_user') || 'null'),
  email: '',
  senha: '',
  erroLogin: '',
  pontos: [],
  detalhe: null,
  contatos: null,
  audioPlayers: {}, // { [evId]: { url, aviso } }
  latFiscal: null,
  lonFiscal: null,
  distanciaAtual: null,
  resultado: 'CONFIRMADO',
  tipoValidado: '',
  observacoes: '',
  midiasCamera: [], // { arquivoCaminho, previewUrl, tipo, nome }
  uploadandoCamera: false,
  erroVistoria: '',
  retornoOk: ''
};

function urlMidiaAutenticada(caminho) {
  if (!caminho) return '';
  if (!caminho.startsWith('/api/midias/')) return '';
  const sep = caminho.includes('?') ? '&' : '?';
  return `${caminho}${sep}token=${encodeURIComponent(st.token)}`;
}

async function api(url, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (st.token) headers['Authorization'] = 'Bearer ' + st.token;
  if (opts.body && !(opts.body instanceof FormData) && !headers['Content-Type']) {
    headers['Content-Type'] = 'application/json';
  }
  const r = await fetch(url, { ...opts, headers });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && st.token) {
    // Token vencido (30 min) ou usuário desativado: volta ao login com o motivo.
    encerrarSessao('Sua sessão expirou. Entre novamente para continuar.');
    const err = new Error(data.erro || 'Sessão expirada.');
    err.tratado = true;
    throw err;
  }
  if (!r.ok) throw new Error((data.erro || `Falha na operação (erro ${r.status}).`) + (data.orientacao ? ' ' + data.orientacao : ''));
  return data;
}

function encerrarSessao(motivo) {
  st.token = '';
  st.usuario = null;
  st.senha = '';
  st.detalhe = null;
  st.erroLogin = motivo || '';
  sessionStorage.removeItem('sm_fiscal_token');
  sessionStorage.removeItem('sm_fiscal_user');
  render();
}

async function entrar(e) {
  e.preventDefault();
  st.erroLogin = '';
  try {
    const res = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email: st.email, senha: st.senha }) });
    if (res.perfil !== 'FISCAL') throw new Error('Esta área é exclusiva para fiscais cadastrados.');
    st.token = res.token;
    st.usuario = res;
    st.senha = '';
    sessionStorage.setItem('sm_fiscal_token', res.token);
    sessionStorage.setItem('sm_fiscal_user', JSON.stringify(res));
    await carregarPontos();
  } catch (err) {
    st.erroLogin = err.message;
    render();
  }
}

async function carregarPontos() {
  st.pontos = await api('/api/fiscal/pontos');
  st.detalhe = null;
  mapaFiscalCtrl = null;
  render();
}

async function abrirPonto(id) {
  st.erroVistoria = '';
  st.retornoOk = '';
  st.contatos = null;
  st.audioPlayers = {};
  st.midiasCamera = [];
  st.observacoes = '';
  st.detalhe = await api('/api/fiscal/pontos/' + id);
  st.tipoValidado = st.detalhe.resumo.tipoOcorrencia;
  // RS008: a posição do fiscal vem só do GPS; começa vazia em vez de copiar a do ponto.
  st.latFiscal = null;
  st.lonFiscal = null;
  st.distanciaAtual = null;
  render();
}

function lerGpsFiscal() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('GPS indisponível neste aparelho. A vistoria exige a posição do GPS no momento de salvar.'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        st.latFiscal = Number(pos.coords.latitude.toFixed(6));
        st.lonFiscal = Number(pos.coords.longitude.toFixed(6));
        if (mapaFiscalCtrl) mapaFiscalCtrl.setFiscalPosition(st.latFiscal, st.lonFiscal);
        atualizarCamposPosicaoNoDom();
        resolve();
      },
      () => reject(new Error('Não foi possível ler sua posição pelo GPS. Ative a localização do aparelho e tente de novo.')),
      { timeout: 10000, enableHighAccuracy: true, maximumAge: 0 }
    );
  });
}

async function capturarGpsFiscal() {
  try {
    await lerGpsFiscal();
  } catch (err) {
    const distEl = document.getElementById('fiscal-dist');
    if (distEl) {
      distEl.textContent = err.message;
      distEl.dataset.tom = 'critico';
    }
  }
}

function atualizarCamposPosicaoNoDom() {
  const latEl = document.getElementById('fiscal-lat');
  const lonEl = document.getElementById('fiscal-lon');
  const distEl = document.getElementById('fiscal-dist');
  if (latEl) latEl.value = st.latFiscal ?? '';
  if (lonEl) lonEl.value = st.lonFiscal ?? '';
  if (st.latFiscal == null || st.lonFiscal == null || !st.detalhe) {
    st.distanciaAtual = null;
    return;
  }
  const pLat = Number(st.detalhe.resumo.latitudeAproximada);
  const pLon = Number(st.detalhe.resumo.longitudeAproximada);
  st.distanciaAtual = Math.round(SaneaMapaGeo.calcularDistanciaMetros(pLat, pLon, st.latFiscal, st.lonFiscal));
  if (distEl) {
    const dentro = st.distanciaAtual <= 100;
    distEl.textContent = dentro
      ? `Distância atual até o ponto: ${st.distanciaAtual} m (dentro do raio permitido)`
      : `Distância atual até o ponto: ${st.distanciaAtual} m (acima do limite de 100 m)`;
    distEl.dataset.tom = dentro ? 'positivo' : 'critico';
  }
}

async function inicializarMapaFiscal() {
  if (!st.detalhe) return;
  const r = st.detalhe.resumo;
  mapaFiscalCtrl = await SaneaMapaGeo.criarMapaFiscal({
    containerId: 'mapa-fiscal',
    pontoLat: r.latitudeAproximada,
    pontoLng: r.longitudeAproximada,
    fiscalLat: st.latFiscal,
    fiscalLng: st.lonFiscal
  });
  atualizarCamposPosicaoNoDom();
}

async function revelarContatos() {
  st.contatos = await api(`/api/fiscal/pontos/${st.detalhe.resumo.id}/contatos`, { method: 'POST' });
  render();
}

async function ouvirAudio(evId) {
  const res = await api(`/api/fiscal/evidencias/${evId}/audio`, { method: 'POST' });
  st.audioPlayers[evId] = {
    url: urlMidiaAutenticada(res.arquivoUsoCaminho),
    aviso: res.avisoAuditoria
  };
  render();
}

async function novoDesfoque(evId) {
  const regiao = prompt('Descreva a região onde aplicar novo desfoque (ex.: canto esquerdo, placa ao fundo):');
  if (!regiao || !regiao.trim()) return;
  const res = await api(`/api/fiscal/evidencias/${evId}/desfoque`, { method: 'POST', body: JSON.stringify({ regiao }) });
  alert(res.mensagem);
  await abrirPonto(st.detalhe.resumo.id);
}

async function salvarTranscricao(evId) {
  const texto = document.getElementById('transc-' + evId)?.value || '';
  const res = await api(`/api/fiscal/evidencias/${evId}/transcricao`, { method: 'PUT', body: JSON.stringify({ transcricao: texto }) });
  alert(res.mensagem);
}

async function capturarMidiaCamera(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  st.erroVistoria = '';
  st.uploadandoCamera = true;
  render();

  for (const file of files) {
    try {
      const fd = new FormData();
      fd.append('arquivo', file);
      fd.append('origem', 'CAMERA');
      const res = await api('/api/fiscal/midias', { method: 'POST', body: fd });
      st.midiasCamera.push({
        arquivoCaminho: res.arquivoCaminho,
        previewUrl: URL.createObjectURL(file),
        tipo: file.type.startsWith('video/') ? 'VIDEO' : 'FOTO',
        nome: file.name
      });
    } catch (err) {
      st.erroVistoria = err.message;
    }
  }
  st.uploadandoCamera = false;
  render();
}

function removerMidiaCamera(idx) {
  const item = st.midiasCamera[idx];
  if (item?.previewUrl) URL.revokeObjectURL(item.previewUrl);
  st.midiasCamera.splice(idx, 1);
  render();
}

async function salvarVistoria() {
  st.erroVistoria = '';
  try {
    // RS008: a posição enviada é a do GPS lida agora, no momento de salvar.
    await lerGpsFiscal();
    const caminhos = st.midiasCamera.map(m => m.arquivoCaminho);
    const res = await api(`/api/fiscal/pontos/${st.detalhe.resumo.id}/vistoria`, {
      method: 'POST',
      body: JSON.stringify({
        resultado: st.resultado,
        tipoOcorrenciaValidado: st.tipoValidado,
        latitudeFiscal: st.latFiscal,
        longitudeFiscal: st.lonFiscal,
        observacoes: st.observacoes,
        midiasCamera: caminhos,
        origensMidia: caminhos.map(() => 'CAMERA')
      })
    });
    st.retornoOk = `Vistoria registrada no ponto ${res.codigoPonto}: ${res.novoStatus} (distância medida: ${res.distanciaMetros} m).`;
    await carregarPontos();
  } catch (err) {
    st.erroVistoria = err.message;
    render();
  }
}

function sair() {
  encerrarSessao('');
}

function renderEvidenciaMorador(ev) {
  const midiaUrl = urlMidiaAutenticada(ev.arquivoUsoCaminho);
  let viewer = '';
  if (ev.tipo === 'FOTO' && midiaUrl) {
    viewer = `<img class="midia-preview-img" src="${esc(midiaUrl)}" alt="Foto enviada pelo morador">`;
  } else if (ev.tipo === 'VIDEO' && midiaUrl) {
    viewer = `<video class="midia-preview-video" src="${esc(midiaUrl)}" controls playsinline preload="metadata"></video>`;
  }

  const audioInfo = st.audioPlayers[ev.id];
  return `
    <div class="midia-item">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap;">
        <span class="t-pequeno"><b>${esc(ev.tipo)}</b> (${ev.origem === 'CAMERA' ? 'Câmera' : ev.origem === 'MICROFONE' ? 'Microfone' : 'Galeria'})</span>
        ${ev.divergente ? '<span class="estado" data-tom="atencao">Mídia divergente</span>' : ''}
      </div>
      ${viewer}
      <span class="t-pequeno" style="color:var(--soft);">${esc(ev.descricaoTratamento)}</span>
      ${ev.tipo === 'FOTO' ? `<button type="button" class="botao" onclick="novoDesfoque(${ev.id})">Marcar área para novo desfoque</button>` : ''}
      ${ev.tipo === 'AUDIO' ? `
        <button type="button" class="botao" onclick="ouvirAudio(${ev.id})">Ouvir áudio (acesso auditado)</button>
        ${audioInfo ? `
          ${audioInfo.url ? `<audio class="midia-preview-audio" src="${esc(audioInfo.url)}" controls></audio>` : ''}
          <span class="t-pequeno" style="color:var(--accent);">${esc(audioInfo.aviso)}</span>
        ` : ''}
        <textarea id="transc-${ev.id}" class="campo" rows="2" placeholder="Transcrição do áudio">${esc(ev.transcricao || '')}</textarea>
        <button type="button" class="botao quieto" onclick="salvarTranscricao(${ev.id})">Salvar correção da transcrição</button>
      ` : ''}
    </div>`;
}

function render() {
  const el = document.getElementById('app');
  if (!st.token) {
    el.innerHTML = `
      <main class="corpo-cel" style="padding-top:44px;">
        <div>
          <h1 style="margin:0; font-family:var(--font-display);">SaneaMapa</h1>
          <p class="t-corpo" style="color:var(--soft); margin:4px 0 0;">Área de vistoria em campo</p>
        </div>
        ${st.erroLogin ? `<div class="chamada" data-tom="critico"><span class="rotulo">Acesso recusado</span><span class="t-pequeno">${esc(st.erroLogin)}</span></div>` : ''}
        <form onsubmit="entrar(event)" style="display:grid; grid-template-columns:minmax(0,1fr); gap:12px;">
          <label class="field-group"><span class="t-rotulo">E-mail institucional</span><input class="campo" type="email" value="${esc(st.email)}" oninput="st.email=this.value" placeholder="nome@exemplo.gov.br" required></label>
          <label class="field-group"><span class="t-rotulo">Senha</span><input class="campo" type="password" value="${esc(st.senha)}" oninput="st.senha=this.value" placeholder="Digite sua senha" required></label>
          <button class="botao primario" type="submit">Entrar</button>
        </form>
        <a href="/index.html" class="t-pequeno">Voltar ao portal</a>
      </main>`;
    return;
  }

  if (!st.detalhe) {
    el.innerHTML = `
      <header class="cab-cel">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <h1 style="margin:0; font-family:var(--font-display); font-size:21px;">Pontos atribuídos</h1>
          <button type="button" class="botao quieto" onclick="sair()">Sair</button>
        </div>
        <span class="t-pequeno" style="color:var(--soft);">${esc(st.usuario?.nome)} · ${st.pontos.length} ponto(s) designado(s)</span>
      </header>
      <main class="corpo-cel">
        ${st.retornoOk ? `<div class="chamada" data-tom="positivo"><span class="rotulo">Vistoria registrada</span><span class="t-pequeno">${esc(st.retornoOk)}</span></div>` : ''}
        ${st.pontos.length === 0 ? `<div class="chamada" data-tom="neutro"><span class="rotulo">Nenhum ponto atribuído</span><span class="t-pequeno">Quando a Prefeitura designar uma ocorrência real para você, ela aparecerá aqui com as fotos, vídeos e a localização enviada pelo cidadão.</span></div>` : ''}
        ${st.pontos.map((p, idx) => `
          <article class="card-ponto">
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              <b>#${idx + 1} · ${esc(p.codigoExibicao)}</b>
              <span class="etiqueta">${esc(p.tipoRotulo)}</span>
            </div>
            <span class="t-pequeno">${esc(p.trechoRua)} · ${esc(p.bairro)} · ${p.quantidadeRelatos} relato(s)</span>
            <span class="t-pequeno">Prioridade: <b>${esc(p.nivelRotulo)}</b></span>
            <button type="button" class="botao primario" onclick="abrirPonto(${p.id})">Iniciar vistoria</button>
          </article>
        `).join('')}
      </main>`;
    return;
  }

  const d = st.detalhe;
  const r = d.resumo;
  el.innerHTML = `
    <header class="cab-cel">
      <div style="display:flex; align-items:center; gap:8px;">
        <button type="button" class="botao quieto" style="padding:4px 8px;" onclick="carregarPontos()">←</button>
        <h1 style="margin:0; font-family:var(--font-display); font-size:21px;">Vistoria ${esc(r.codigoExibicao)}</h1>
      </div>
      <span class="t-pequeno" style="color:var(--soft);">${esc(r.trechoRua)} · ${esc(r.bairro)}</span>
    </header>
    <main class="corpo-cel">
      ${st.erroVistoria ? `<div class="chamada" data-tom="critico"><span class="rotulo">Vistoria não salva</span><span class="t-pequeno">${esc(st.erroVistoria)}</span></div>` : ''}

      <section class="card-ponto">
        <b>Localização enviada pelo cidadão (raio máx. 100 m)</b>
        <span class="t-pequeno"><b>Endereço:</b> ${esc(r.trechoRua)} · ${esc(r.bairro)}</span>
        <span class="t-pequeno"><b>Coordenada do ponto:</b> <span class="t-meta">${r.latitudeAproximada}, ${r.longitudeAproximada}</span></span>
        <div id="mapa-fiscal" class="mapa-container" style="height:220px;"></div>
        <span id="fiscal-dist" class="estado" data-tom="neutro">Sua posição ainda não foi lida pelo GPS.</span>
        <button type="button" class="botao" onclick="capturarGpsFiscal()">Conferir minha distância pelo GPS</button>
        <span class="t-pequeno">A posição é lida de novo pelo GPS ao salvar a vistoria e não pode ser digitada (RS008).</span>
        <div class="grid-2">
          <label class="field-group"><span class="t-pequeno">Latitude do fiscal (GPS)</span><input id="fiscal-lat" class="campo" type="text" value="${st.latFiscal ?? ''}" readonly></label>
          <label class="field-group"><span class="t-pequeno">Longitude do fiscal (GPS)</span><input id="fiscal-lon" class="campo" type="text" value="${st.lonFiscal ?? ''}" readonly></label>
        </div>
      </section>

      <section class="card-ponto">
        <b>Relatos enviados (${d.relatos.length})</b>
        ${d.relatos.map(rel => `
          <div style="padding:8px; background:var(--sunk); border-radius:var(--radius-sm); display:grid; gap:4px;">
            <span class="t-pequeno"><b>${esc(rel.protocolo)}</b> · ${rel.identificado ? 'Identificado' : 'Anônimo'}</span>
            ${rel.logradouro || rel.pontoReferencia ? `<span class="t-pequeno" style="color:var(--soft);">${esc([rel.logradouro, rel.bairro, rel.pontoReferencia].filter(Boolean).join(' · '))}</span>` : ''}
            <span class="t-pequeno">${esc(rel.descricao || 'Sem descrição adicional.')}</span>
          </div>
        `).join('')}
      </section>

      <section class="card-ponto">
        <b>Fotos, vídeos e áudios dos cidadãos (${d.evidencias.length})</b>
        <div class="midia-lista">
          ${d.evidencias.map(renderEvidenciaMorador).join('')}
        </div>
      </section>

      <section class="card-ponto">
        <b>Contatos dos moradores identificados</b>
        ${st.contatos ? st.contatos.contatos.map(c => `<span class="t-pequeno">${esc(c.nomeMorador)} · ${esc(c.telefoneMorador)}</span>`).join('') + `<span class="t-pequeno" style="color:var(--soft);">${esc(st.contatos.avisoAuditoria)}</span>`
          : `<button type="button" class="botao" onclick="revelarContatos()">Ver nome e telefone (acesso registrado)</button>`}
      </section>

      <section class="card-ponto">
        <b>Registro da vistoria</b>
        <label class="field-group"><span class="t-pequeno">Resultado</span>
          <select class="campo" onchange="st.resultado=this.value">
            <option value="CONFIRMADO" ${st.resultado === 'CONFIRMADO' ? 'selected' : ''}>Confirmado</option>
            <option value="NAO_CONFIRMADO" ${st.resultado === 'NAO_CONFIRMADO' ? 'selected' : ''}>Não confirmado</option>
          </select>
        </label>
        <label class="field-group"><span class="t-pequeno">Tipo de ocorrência validado</span>
          <select class="campo" onchange="st.tipoValidado=this.value">
            <option value="CASA_SEM_AGUA" ${st.tipoValidado==='CASA_SEM_AGUA'?'selected':''}>Casa sem ligação de água</option>
            <option value="AGUA_FORA_PADRAO" ${st.tipoValidado==='AGUA_FORA_PADRAO'?'selected':''}>Água fora do padrão</option>
            <option value="RUA_SEM_ESGOTO" ${st.tipoValidado==='RUA_SEM_ESGOTO'?'selected':''}>Rua sem rede de esgoto</option>
            <option value="ESGOTO_CEU_ABERTO" ${st.tipoValidado==='ESGOTO_CEU_ABERTO'?'selected':''}>Esgoto a céu aberto</option>
          </select>
        </label>
        <label class="field-group"><span class="t-pequeno">Observações técnicas</span>
          <textarea class="campo" rows="3" placeholder="Descreva o que foi constatado no local" oninput="st.observacoes=this.value">${esc(st.observacoes)}</textarea>
        </label>

        <input id="inp-cam-fiscal" class="input-oculto" type="file" accept="image/*,video/*" capture="environment" onchange="capturarMidiaCamera(this.files); this.value='';">
        <button type="button" class="botao" ${st.uploadandoCamera ? 'disabled' : ''} onclick="document.getElementById('inp-cam-fiscal').click()">
          ${st.uploadandoCamera ? 'Enviando registro da câmera...' : `Capturar foto/vídeo pela câmera (${st.midiasCamera.length})`}
        </button>

        ${st.midiasCamera.length ? `
          <div class="midia-lista">
            ${st.midiasCamera.map((m, idx) => `
              <div class="midia-item">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span class="t-pequeno"><b>${m.tipo}</b> · ${esc(m.nome)}</span>
                  <button type="button" class="botao quieto" style="padding:2px 8px; min-height:28px;" onclick="removerMidiaCamera(${idx})">Remover</button>
                </div>
                ${m.tipo === 'FOTO' ? `<img class="midia-preview-img" src="${esc(m.previewUrl)}" alt="Foto da vistoria">` : `<video class="midia-preview-video" src="${esc(m.previewUrl)}" controls playsinline muted></video>`}
              </div>
            `).join('')}
          </div>
        ` : ''}

        <button type="button" class="botao primario" ${st.uploadandoCamera ? 'disabled' : ''} onclick="salvarVistoria()">Salvar vistoria</button>
      </section>
    </main>`;

  inicializarMapaFiscal();
}

if (st.token) { carregarPontos().catch(() => sair()); } else { render(); }
</script>
</body>
</html>
